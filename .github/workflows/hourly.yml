name: Hourly reading

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07 UTC (:00 is GitHub's busiest minute)
  workflow_dispatch:       # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch.js
        env:
          ELECTRICITYMAPS_TOKEN: ${{ secrets.ELECTRICITYMAPS_TOKEN }}
      - name: Commit history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Reading $(date -u +%Y-%m-%dT%H:00Z)"
          git push
